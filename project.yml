# Proyecto de Xcode para XcodeGen. El .xcodeproj se GENERA en CI
# (xcodegen generate) y nunca se edita a mano ni se versiona.
name: LPRGauge

options:
  bundleIdPrefix: io.github.luispr99
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.12.1"
    CURRENT_PROJECT_VERSION: "26"
    SWIFT_VERSION: "5.0"

packages:
  Core:
    path: Core
  # Navegación (BSD-3, sin telemetría en el núcleo). Versión fija: antes de la
  # 1.0 cambia la API a menudo. Solo se usa el producto FerrostarCore, sin mapa
  Ferrostar:
    url: https://github.com/stadiamaps/ferrostar
    exactVersion: 0.57.0

targets:
  LPRGauge:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: Core
        product: LPRCore
      - package: Ferrostar
        product: FerrostarCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LPR Gauge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: >-
          LPR Gauge se conecta por Bluetooth al cuadro de la moto para enviarle la
          navegación y el estado del iPhone.
        NSLocationWhenInUseUsageDescription: >-
          LPR Gauge usa tu ubicación para calcular la ruta, guiarte giro a giro y
          mostrar la altitud.
        # Segundo plano (2026-10-09): el guiado sigue con la pantalla bloqueada
        # (ubicación) y el enlace con el cuadro también (Bluetooth). No son
        # entitlements: valen con la cuenta gratuita (docs/DECISIONES.md)
        UIBackgroundModes:
          - location
          - bluetooth-central
    settings:
      base:
        # Fijo desde el primer día: la cuenta gratuita solo admite 10 App IDs
        # nuevos cada 7 días (docs/DECISIONES.md)
        PRODUCT_BUNDLE_IDENTIFIER: io.github.luispr99.lprgauge
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme: {}
